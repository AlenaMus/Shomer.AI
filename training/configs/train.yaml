# Training configuration for offensive-hebrew LoRA fine-tune.

base_model: "Qwen/Qwen2.5-7B-Instruct"   # swap to "dicta-il/dictalm2.0-instruct" for Hebrew-optimized tokenizer
max_seq_length: 512
load_in_4bit: true

dataset:
  name: "SinaLab/Offensive-Hebrew"
  use_balanced_subset: true              # 2500-tweet balanced split for round 1
  text_column: "text"
  label_columns: ["abusive", "hate", "violence", "pornographic"]
  data_dir: "data"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "outputs/offensive-hebrew-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42
  bf16: true

system_prompt: |
  You are a strict Hebrew offensive-language classifier. Always reply with valid JSON only, no prose.
  Schema: {"is_offensive": bool, "category": one of ["abusive","hate","violence","pornographic","non_offensive"], "confidence": float in [0,1]}.
